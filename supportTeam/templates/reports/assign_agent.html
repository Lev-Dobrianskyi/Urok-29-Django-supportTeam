{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Assign Agent to "{{ object.title }}"</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Assign</button>
    </form>
</div>
{% endblock %}
