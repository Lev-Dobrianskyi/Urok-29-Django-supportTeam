{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Delete Category</h2>
    <p>Are you sure you want to delete "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'category_list' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
