{% extends 'base.html' %}
{% block content %}
<div class="list-header">
    <h2>Categories</h2>
    <a href="{% url 'category_create' %}" class="btn btn-primary">Add Category</a>
</div>
<table class="data-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>
                <a href="{% url 'category_update' category.pk %}" class="btn">Edit</a>
                <a href="{% url 'category_delete' category.pk %}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
